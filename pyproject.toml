[project]
name = "monitoring-request-manager"
version = "0.1.0"
description = "Nextcloud ExApp for monitoring file collection campaigns"
requires-python = ">=3.12"
dependencies = [
    "nc_py_api[app]>=0.19.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.2",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.9",
    "structlog>=24.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["ex_app/lib"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
